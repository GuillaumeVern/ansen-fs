<nz-card nzHoverable
         [nzCover]="coverTemplate"
         [attr.role]="data.type === 'FOLDER' ? 'button' : null"
         [attr.tabindex]="data.type === 'FOLDER' ? 0 : null"
         [attr.aria-label]="data.type === 'FOLDER' ? 'Open folder ' + data.name : null"
         (click)="open()"
         (keydown)="onCardKeydown($event)">

  <nz-card-meta [nzTitle]="data.name"
                [nzDescription]="displaySize" />

  <div class="card-actions">
    <button nz-button nzType="primary" nzSize="small" nzShape="circle"
            [nzLoading]="isDownloading"
            [attr.aria-label]="'Download ' + data.name"
            (click)="download(); $event.stopPropagation()">
      <nz-icon nzType="download" aria-hidden="true" />
    </button>

    <button
      nz-button
      nzType="primary"
      nzDanger
      nzSize="small"
      nzShape="circle"
      [attr.aria-label]="'Delete ' + data.name"
      (click)="onDeleteClick($event)">
      <nz-icon nzType="delete" aria-hidden="true" />
    </button>
  </div>
</nz-card>

<ng-template #coverTemplate>
  <div class="card-cover-wrapper">
    @if (previewFailed || !previewObjectUrl) {
      <div class="file-icon-placeholder">
        <nz-icon [nzType]="fallbackIcon" aria-hidden="true" />
      </div>
    } @else {
      <img [alt]="data.name"
           [src]="previewObjectUrl"
           class="preview-thumb"
           (error)="onPreviewError()" />
    }
  </div>
</ng-template>
