<nz-card nzHoverable
         [nzCover]="coverTemplate"
         (click)="open()">

  <nz-card-meta [nzTitle]="data.name"
                [nzDescription]="data.type === 'FOLDER' ? 'Folder' : (data.size | number) + ' bytes'" />

  <div class="card-actions">
    <button nz-button nzType="primary" nzSize="small" nzShape="circle" (click)="download(); $event.stopPropagation()">
      <nz-icon nzType="download" />
    </button>

    <button
      nz-button
      nzType="primary"
      nzDanger
      nzSize="small"
      nzShape="circle"
      (click)="onDeleteClick($event)">
      <nz-icon nzType="delete" />
    </button>
  </div>

  @if (isDownloading) {
    <div class="progress-overlay" (click)="$event.stopPropagation()">
      <p>Downloading... {{ progress }}%</p>
      <div class="progress-bar-container">
        <div class="progress-bar" [style.width.%]="progress"></div>
      </div>
    </div>
  }
</nz-card>

<ng-template #coverTemplate>
  <div class="card-cover-wrapper">
    @if (previewFailed || !previewObjectUrl) {
      <div class="file-icon-placeholder">
        <nz-icon [nzType]="fallbackIcon" />
      </div>
    } @else {
      @switch (previewKind) {
        @case ('image') {
          <img [alt]="data.name"
               [src]="previewObjectUrl"
               class="preview-thumb"
               (error)="onPreviewError()" />
        }
        @case ('pdf') {
          <iframe [src]="trustedPreviewUrl" class="preview-pdf" title="PDF preview"></iframe>
        }
        @default {
          <div class="file-icon-placeholder">
            <nz-icon [nzType]="fallbackIcon" />
          </div>
        }
      }
    }
  </div>
</ng-template>
