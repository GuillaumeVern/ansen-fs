<div #container class="store-wrapper">

  <header class="action-toolbar">
    <div class="toolbar-left">
      <nz-breadcrumb>
        <nz-breadcrumb-item (click)="navigateToIndex(0)" class="clickable-crumb">
          <nz-icon nzType="home" nzTheme="outline" /> Root
        </nz-breadcrumb-item>

        @for (folderName of arianeHistory(); let i = $index; let isLast = $last; track i) {
          @if (i > 0) {
            <nz-breadcrumb-item
              [class.active-crumb]="isLast"
              [class.clickable-crumb]="!isLast"
              (click)="!isLast ? navigateToIndex(i) : null">
              {{ folderName }}
            </nz-breadcrumb-item>
          }
        }
      </nz-breadcrumb>
    </div>

    <div class="toolbar-right">
      <button nz-button nzType="text" (click)="uploadController()?.triggerFileInput()">
        <nz-icon nzType="file-add" nzTheme="outline" /> Upload Files
      </button>
      <button nz-button nzType="text" (click)="uploadController()?.triggerFolderInput()">
        <nz-icon nzType="folder-add" nzTheme="outline" /> Upload Folder
      </button>
    </div>
  </header>

  <cdk-virtual-scroll-viewport
    [itemSize]="itemHeight"
    class="viewport"
    [style.--cols]="columns()"
    [style.--item-h.px]="itemHeight"
    (scrolledIndexChange)="onScrollIndexChange($event)">

    <div *cdkVirtualFor="let row of rows(); trackBy: trackByRow" class="grid-row">
      @for (node of row; track node.uuid) {
        <app-store-element [data]="node" class="grid-item" />
      }
    </div>
  </cdk-virtual-scroll-viewport>

</div>
