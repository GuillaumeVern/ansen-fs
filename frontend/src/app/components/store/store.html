<div #container class="store-wrapper">

  <h1 class="sr-only">Files</h1>

  <header class="action-toolbar">
    <div class="toolbar-left">
      <nav aria-label="Breadcrumb">
        <nz-breadcrumb>
          @for (folderName of arianeHistory(); let i = $index; let isLast = $last; track i) {
            <nz-breadcrumb-item
              [class.active-crumb]="isLast"
              [class.clickable-crumb]="!isLast"
              [attr.tabindex]="isLast ? null : 0"
              [attr.role]="isLast ? null : 'link'"
              [attr.aria-current]="isLast ? 'page' : null"
              (click)="!isLast ? navigateToIndex(i) : null"
              (keydown)="onCrumbKeydown($event, i, isLast)">
              @if (i === 0) {
                <nz-icon nzType="home" nzTheme="outline" aria-hidden="true" />
              }
              {{ folderName }}
            </nz-breadcrumb-item>
          }
        </nz-breadcrumb>
      </nav>
    </div>

    <div class="toolbar-right">
      <button nz-button nzType="text" (click)="uploadController()?.triggerFileInput()">
        <nz-icon nzType="file-add" nzTheme="outline" aria-hidden="true" /> Upload Files
      </button>
      <button nz-button nzType="text" (click)="uploadController()?.triggerFolderInput()">
        <nz-icon nzType="folder-add" nzTheme="outline" aria-hidden="true" /> Upload Folder
      </button>
    </div>
  </header>

  @if (isLoading()) {
    <p class="loading-status" role="status">Loading…</p>
  }

  <cdk-virtual-scroll-viewport
    [itemSize]="itemHeight"
    class="viewport"
    [style.--cols]="columns()"
    [style.--item-h.px]="itemHeight"
    (scrolledIndexChange)="onScrollIndexChange($event)">

    <div *cdkVirtualFor="let row of rows(); trackBy: trackByRow" class="grid-row">
      @for (node of row; track node.uuid) {
        <app-store-element [data]="node" class="grid-item" (delete)="deleteItem($event)"/>
      }
    </div>
  </cdk-virtual-scroll-viewport>

</div>
