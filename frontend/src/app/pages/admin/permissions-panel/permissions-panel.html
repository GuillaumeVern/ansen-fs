<form class="panel-toolbar" [formGroup]="form" (ngSubmit)="add()">
  <label class="sr-only" for="new-permission-name">New permission name</label>
  <input
    id="new-permission-name"
    nz-input
    formControlName="name"
    placeholder="New permission name"
    style="width: 240px;"
    [attr.aria-invalid]="form.controls.name.invalid && form.controls.name.touched ? true : null"
  />
  <button nz-button nzType="primary" [disabled]="form.invalid">
    <nz-icon nzType="plus" aria-hidden="true" /> Add permission
  </button>
</form>

<nz-table [nzData]="permissions()" [nzShowPagination]="false" nzSize="middle">
  <thead>
    <tr>
      <th>Name</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (permission of permissions(); track permission.id) {
      <tr>
        <td>{{ permission.name }}</td>
        <td class="actions-col">
          <button
            nz-button
            nzType="text"
            nzDanger
            nzSize="small"
            [attr.aria-label]="'Delete permission ' + permission.name"
            nz-popconfirm
            nzPopconfirmTitle="Delete this permission?"
            (nzOnConfirm)="remove(permission)"
          >
            <nz-icon nzType="delete" aria-hidden="true" /> Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</nz-table>
