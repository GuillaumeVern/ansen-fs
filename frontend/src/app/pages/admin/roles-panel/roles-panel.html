<div class="panel-toolbar">
  <button nz-button nzType="primary" (click)="openCreate()">
    <nz-icon nzType="plus" /> New role
  </button>
</div>

<nz-table [nzData]="roles()" [nzShowPagination]="false" nzSize="middle">
  <thead>
    <tr>
      <th>Name</th>
      <th>Permissions</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (role of roles(); track role.id) {
      <tr>
        <td>{{ role.name }}</td>
        <td>
          @for (permission of role.permissions; track permission.id) {
            <nz-tag>{{ permission.name }}</nz-tag>
          }
        </td>
        <td class="actions-col">
          <button nz-button nzType="text" nzSize="small" (click)="openEdit(role)">
            <nz-icon nzType="edit" /> Edit
          </button>
          <button
            nz-button
            nzType="text"
            nzDanger
            nzSize="small"
            [disabled]="isProtected(role)"
            [title]="isProtected(role) ? 'Built-in roles cannot be deleted' : ''"
            nz-popconfirm
            nzPopconfirmTitle="Delete this role?"
            (nzOnConfirm)="deleteRole(role)"
          >
            <nz-icon nzType="delete" /> Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</nz-table>

<nz-modal
  [nzVisible]="showModal()"
  [nzTitle]="editingRoleId() === null ? 'New role' : 'Edit role'"
  (nzOnCancel)="cancel()"
  (nzOnOk)="save()"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="form">
      <nz-form-item>
        <nz-form-control nzErrorTip="Name is required">
          <input
            nz-input
            formControlName="name"
            placeholder="Role name"
            [readonly]="editingIsProtected()"
          />
        </nz-form-control>
      </nz-form-item>
    </form>
    <nz-select
      style="width: 100%"
      nzMode="multiple"
      nzPlaceHolder="Select permissions"
      [ngModel]="selectedPermissionIds()"
      (ngModelChange)="selectedPermissionIds.set($event)"
    >
      @for (permission of permissions(); track permission.id) {
        <nz-option [nzValue]="permission.id" [nzLabel]="permission.name" />
      }
    </nz-select>
  </ng-container>
</nz-modal>
