<div class="panel-toolbar">
  <button nz-button nzType="primary" (click)="openCreateModal()">
    <nz-icon nzType="plus" aria-hidden="true" /> New user
  </button>
</div>

<nz-table [nzData]="users()" [nzShowPagination]="false" nzSize="middle">
  <thead>
    <tr>
      <th>Username</th>
      <th>Roles</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (user of users(); track user.id) {
      <tr>
        <td>{{ user.username }}</td>
        <td>
          @for (role of user.roles; track role.id) {
            <nz-tag>{{ role.name }}</nz-tag>
          }
        </td>
        <td class="actions-col">
          <button nz-button nzType="text" nzSize="small" [attr.aria-label]="'Edit roles for ' + user.username" (click)="openEditRoles(user)">
            <nz-icon nzType="edit" aria-hidden="true" /> Edit roles
          </button>
          <button nz-button nzType="text" nzSize="small" [attr.aria-label]="'Reset password for ' + user.username" (click)="openResetPassword(user)">
            <nz-icon nzType="key" aria-hidden="true" /> Reset password
          </button>
          <button
            nz-button
            nzType="text"
            nzDanger
            nzSize="small"
            [disabled]="user.id === currentUserId()"
            [attr.aria-label]="'Delete user ' + user.username"
            nz-popconfirm
            nzPopconfirmTitle="Delete this user?"
            (nzOnConfirm)="deleteUser(user)"
          >
            <nz-icon nzType="delete" aria-hidden="true" /> Delete
          </button>
        </td>
      </tr>
    }
  </tbody>
</nz-table>

<nz-modal
  [nzVisible]="showCreateModal()"
  nzTitle="New user"
  (nzOnCancel)="cancelCreate()"
  (nzOnOk)="submitCreate()"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="createForm">
      <nz-form-item>
        <nz-form-control nzErrorTip="Username is required">
          <label class="sr-only" for="new-user-username">Username</label>
          <input
            id="new-user-username"
            nz-input
            formControlName="username"
            placeholder="Username"
            [attr.aria-invalid]="createForm.controls.username.invalid && createForm.controls.username.touched ? true : null"
          />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control nzErrorTip="Password is required">
          <label class="sr-only" for="new-user-password">Password</label>
          <input
            id="new-user-password"
            nz-input
            type="password"
            formControlName="password"
            placeholder="Password"
            [attr.aria-invalid]="createForm.controls.password.invalid && createForm.controls.password.touched ? true : null"
          />
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>

<nz-modal
  [nzVisible]="editingUser() !== null"
  nzTitle="Edit roles"
  (nzOnCancel)="cancelEditRoles()"
  (nzOnOk)="saveRoles()"
>
  <ng-container *nzModalContent>
    <nz-select
      style="width: 100%"
      nzMode="multiple"
      aria-label="Roles for this user"
      nzPlaceHolder="Select roles"
      [ngModel]="selectedRoleIds()"
      (ngModelChange)="selectedRoleIds.set($event)"
    >
      @for (role of roles(); track role.id) {
        <nz-option [nzValue]="role.id" [nzLabel]="role.name" />
      }
    </nz-select>
  </ng-container>
</nz-modal>

<nz-modal
  [nzVisible]="resettingPasswordUser() !== null"
  nzTitle="Reset password"
  (nzOnCancel)="cancelResetPassword()"
  (nzOnOk)="submitResetPassword()"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="passwordForm">
      <nz-form-item>
        <nz-form-control nzErrorTip="New password is required">
          <label class="sr-only" for="reset-password-new">New password</label>
          <input
            id="reset-password-new"
            nz-input
            type="password"
            formControlName="newPassword"
            placeholder="New password"
            [attr.aria-invalid]="passwordForm.controls.newPassword.invalid && passwordForm.controls.newPassword.touched ? true : null"
          />
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
