<div class="login-page">
  <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
    <h1>Sign in</h1>

    <nz-form-item>
      <nz-form-control nzErrorTip="Username is required">
        <label class="sr-only" for="login-username">Username</label>
        <input
          id="login-username"
          nz-input
          formControlName="username"
          placeholder="Username"
          autocomplete="username"
          [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched ? true : null"
        />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-control nzErrorTip="Password is required">
        <label class="sr-only" for="login-password">Password</label>
        <input
          id="login-password"
          nz-input
          type="password"
          formControlName="password"
          placeholder="Password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched ? true : null"
        />
      </nz-form-control>
    </nz-form-item>

    @if (errorMessage()) {
      <p class="login-error" role="alert">{{ errorMessage() }}</p>
    }

    <button nz-button nzType="primary" nzBlock [nzLoading]="isSubmitting()" [disabled]="form.invalid">
      Sign in
    </button>
  </form>
</div>
