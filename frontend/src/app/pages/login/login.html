<div class="login-page">
  <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
    <h1>Sign in</h1>

    <nz-form-item>
      <nz-form-control nzErrorTip="Username is required">
        <input nz-input formControlName="username" placeholder="Username" autocomplete="username" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-control nzErrorTip="Password is required">
        <input
          nz-input
          type="password"
          formControlName="password"
          placeholder="Password"
          autocomplete="current-password"
        />
      </nz-form-control>
    </nz-form-item>

    @if (errorMessage()) {
      <p class="login-error">{{ errorMessage() }}</p>
    }

    <button nz-button nzType="primary" nzBlock [nzLoading]="isSubmitting()" [disabled]="form.invalid">
      Sign in
    </button>
  </form>
</div>
