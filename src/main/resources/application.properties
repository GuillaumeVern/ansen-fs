spring.application.name=anzenfs

spring.threads.virtual.enabled=true

# Needed for WebDavController to receive OPTIONS itself (DAV/Allow headers) instead of the
# servlet's generic fallback response.
spring.mvc.dispatch-options-request=true

# Spring's FormContentFilter drains the request body of any PUT/PATCH/DELETE sent as
# application/x-www-form-urlencoded (curl's default when no Content-Type is set) into request
# parameters before a controller ever sees it - silently truncating a WebDAV PUT upload to 0
# bytes rather than erroring. Nothing in this app relies on that filter (every @PutMapping here
# takes @RequestBody JSON), so it's disabled globally rather than scoped away from /webdav/**.
spring.mvc.formcontent.filter.enabled=false

spring.datasource.url=jdbc:sqlite:${custom.db.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always

# Max size for a single file
spring.servlet.multipart.max-file-size=500GB
# Max size for the entire request
spring.servlet.multipart.max-request-size=500GB

management.server.port=9090
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.info.env.enabled=true

logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.clean-history-on-start=true